name: Daily EDINET batch (docs-diff + xbrl)

# 毎日 20:00 JST = 11:00 UTC に NAS 上で順番に実行する。
# 当日中に提出された有報・四半期報告 etc. のメタを取り込み、未 parse の XBRL を
# financial_facts に展開する。edinet-codes (事業者コード) は週次想定なので別運用。
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  edinet:
    runs-on: self-hosted
    # self-hosted runner は 1 並列なので、このジョブが長引くと daily batch (prices +
    # notify) が queue で待たされる。想定 (数分) を大きく超えたら諦めて runner を返す。
    timeout-minutes: 90
    steps:
      - name: Fetch EDINET document metadata (diff)
        # edinet_documents の MAX(submit_datetime) 以降を今日まで取得。
        # 1 日分なら数秒〜1 分。
        run: bash "$NAS_WORKSPACE/run.sh" edinet-docs-diff

      - name: Parse XBRL into financial_facts
        # parsed_at IS NULL のレコードを arelle で parse。新規取り込み分 (~1日分) は
        # 数分で完了する想定。
        #
        # LIMIT で 1 回あたりの処理件数に蓋をしている。arelle は doc 1 件 5〜10 秒
        # かかるので、積み残しが溜まった状態で無制限に走らせると 1 ジョブが十数時間
        # 居座り、単一 runner を占有して他の daily batch を全部止めてしまう。
        # (実際 2026-07 に arelle 未インストールでこのステップが失敗し続け、
        #  積み残しが 4,500 件 = 約 7〜13 時間ぶんまで膨らんだ)
        # 上限に当たっても parsed_at ベースで自然に翌日へ繰り越されるだけ。
        # 大量の積み残しを一気に消化したいときは NAS で `./run.sh xbrl-bg` を使う。
        #
        # `xbrl` ではなく `xbrl-daily` を叩くのは、attached な docker run だと
        # NAS のメモリ逼迫時に docker クライアント側が殺されて、コンテナは完走して
        # いるのにステップだけ exit 137 で失敗する事故が起きるため (run.sh の
        # xbrl-daily のコメント参照)。xbrl-daily は detached + ポーリング待ち。
        env:
          LIMIT: '300'
        run: bash "$NAS_WORKSPACE/run.sh" xbrl-daily
