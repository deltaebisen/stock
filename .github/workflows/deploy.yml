name: Deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to NAS workspace
        run: |
          # NAS_WORKSPACE は setup-runner.sh で渡している NAS ホスト絶対パス
          # (例: /mnt/public/develop/stock)。同じパスで runner にも bind mount してある
          # ので、ここでの rsync も、後続の docker -v マウントも同一パスで扱える。
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='frontend/out/' \
            --exclude='*.log' \
            "${{ github.workspace }}/" "$NAS_WORKSPACE/"

      - name: Rebuild and restart Next.js server
        run: |
          # bash 経由で invoke (file の x bit に依存しないため)。
          # run.sh 内の SCRIPT_DIR がホスト絶対パスとして解決される必要があるので
          # NAS_WORKSPACE 配下のパスで叩く。
          # web-rebuild は強制再起動 (rsync された新コードを反映)。
          # .next/ は named volume なので Turbopack incremental cache で 2 回目以降の build は速い。
          bash "$NAS_WORKSPACE/run.sh" web-rebuild

      - name: Show deployed commit
        run: |
          echo "Deployed: ${{ github.sha }} (${{ github.event.head_commit.message }}) → $NAS_WORKSPACE"
